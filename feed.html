<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retu -Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-body">
    <div class="feed-container">
        <h1>Welcome to Retu Feed</h1>
        <p>This is the feed page of the Retu social media platform.</p>
        <!-- Add your feed content here -->

        <header class="top-bar"
        <span class="logo">Retu</span>
        button class="logout-button" id="logoutButton">Logout</button>
    </header>

    main class="feed-container">
        <article class="post-card">
            <div class="post-header">
                <span class="post-author">User123</span>
                <span class="post-timestamp">2 hours ago</span>
            </div>
            <p class="post-caption"Welcome to my first post on Retu!</p>
            <div class="post-actions">
              <button class="action-btn like-btn">p <span>12</span></button 
              </div>
              </article>
            </main>

            <nav class="bottom-nav">
                <button class="nav-btn" id="homeButton">Home</button>
                <button class="nav-btn" id="profileButton">Profile</button>
                <button class="nav-btn" id="settingsButton">Settings</button>
            </nav>

            <script src="script.js"></script>


        
</body>
</html>
