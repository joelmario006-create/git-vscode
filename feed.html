<!DOCTYPE html>
<lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retu -Feed</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .scroll-container {
            width: 420px;
            height: 100vh;
            margin: 0 auto;
            overflow-y: scroll;
            scroll-snap-type: #000000;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .scroll-area {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            background-color: #000000;
            border-bottom: 1px solid #222222;
        }

    </style>
    </head>
<class="feed-body">

    <header class="right-top-bar"></header>

    
    <!-- Dark-Navy Top-Right Bar with White Divider Line -->
    <header style="position: fixed; top: 0; left: calc(50% + 210px); right: 0; height: 60px; background-color: #031547; border-bottom: 2px solid #ffffff; z-index: 9999;">
        <!-- Crisp White Profile Icon sitting flush on top of the white line (leaves space on left for '+' later) -->
        <button id="topProfileBtn" title="Profile" style="position: absolute; left: 66px; bottom: 2px; width: 38px; height: 38px; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                <circle id="topProfileRing" cx="12" cy="12" r="10" stroke="#ffffff" stroke-width="1.8"/>
                <circle id="topProfileHead" cx="12" cy="9" r="3" stroke="#ffffff" stroke-width="1.8"/>
                <path id="topProfileBody" d="M6.5 18.5C7.8 16.2 9.7 15 12 15C14.3 15 16.2 16.2 17.5 18.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <!-- Dropdown Panel Directly Below the White Line (top: 60px) -->
    <aside id="profileDropdownPanel" style="display: none; position: fixed; top: 60px; left: calc(50% + 210px); right: 0; background-color: #031547; border-bottom: 1px solid #007AFF; padding: 20px 24px; color: #ffffff; font-family: Arial, sans-serif; z-index: 9998; box-shadow: 0 12px 28px rgba(0,0,0,0.45);">
        
        <!-- State A: Shown when SIGNED OUT -->
        <div id="signedOutDropdown">
            <p id="signInNotice" style="font-size: 14px; color: #93c5fd; margin-bottom: 14px; font-weight: 600;">
                Sign in with Google to access your profile
            </p>
            <button id="googleSignInBtn" style="display: inline-flex; align-items: center; gap: 10px; background-color: #ffffff; color: #1f2937; border: none; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>
        </div>

        <!-- State B: Shown when SIGNED IN -->
        <div id="signedInDropdown" style="display: none; flex-direction: column; gap: 14px;">
            <div id="authSuccessBanner" style="display: none; background: rgba(16, 185, 129, 0.18); border: 1px solid #10b981; color: #34d399; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600;">
                You have successfully Sign up with Google
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
                <span id="dropdownColorCircle" style="width: 48px; height: 48px; border-radius: 50%; background-color: #007AFF; display: inline-block; flex-shrink: 0;"></span>
                <div>
                    <div id="dropdownDisplayName" style="font-size: 16px; font-weight: 700;">Joel Mario</div>
                    <div id="dropdownUsername" style="font-size: 13px; color: #93c5fd;">@joel_mario</div>
                </div>
            </div>
            <p id="dropdownBio" style="font-size: 13px; color: #cbd5e1; margin: 0;">Feel free to use your words to the world</p>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px;">
                <a href="user-page.html" style="background-color: #ffffff; color: #031547; text-decoration: none; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700;">Go to page</a>
                <a href="profile.html" style="background-color: #007AFF; color: #ffffff; text-decoration: none; border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 600;">Edit Profile</a>
                <button id="signOutBtn" style="background: rgba(255,255,255,0.12); color: #ffffff; border: none; border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;">Sign Out</button>
            </div>
        </div>
    </aside>

    <main class="scroll-container" style="position: relative;">
        <div id="videoStageAuthToast" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.92); color: #ffffff; padding: 10px 20px; border-radius: 999px; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; z-index: 10000; box-shadow: 0 6px 20px rgba(0,0,0,0.45); white-space: nowrap;">
            You have successfully Sign up With Google
        </div>
        <section class="scroll-area"></section>
        <section class="scroll-area"></section>
    </main>
    
        

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script src="script.js"></script>

     
</body>
</html>
