<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retu -Feed</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .right-panel {
            position: fixed;
            top: 65px;
            left: calc(50 + 210px);
            right: 0;
            padding: 20px  24px;
            z-index: 50;
        }
        .google-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>


</head>
<body class="feed-body">

   <header class="right-top-bar">
    <button class="top-icon-btn" id="postBtn" title="Create Poster">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" 
            <circle cx="12" cy="12" r="9.5" stroke="#ffffff" stroke-width="1.8"/>
            <path d="M12" 8V16M8 12H16 stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
            
        </svg>
    </button>
</header> 

    <main class="scroll-container">
    <section class="scroll-area"></section>
    <section class="scroll area"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script src="script.js"></script>

     
</body>
</html>
