    <title>Retu -Feed</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .scroll-container {
            width: 420px;
            height: 100vh;
            margin: 0 auto;
            overflow-y: scroll;
            scroll-snap-type: #000000;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .scroll-area {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            background-color: #000000;
            border-bottom: 1px solid #222222;
        }

    </style>
