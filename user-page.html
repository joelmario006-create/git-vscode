<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retu — Creator Page</title>
    <link rel="icon" type="image/jpeg" href="images/Retu logo.jpeg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #060818;
            color: #ffffff;
            min-height: 100vh;
            padding: 22px 24px;
        }
        .page-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        .top-nav {
            margin-bottom: 24px;
        }
        .back-arrow {
            color: #ffffff;
            text-decoration: none;
            font-size: 26px;
            display: inline-flex;
            align-items: center;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
        }
        .creator-color-avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background-color: #007AFF;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .creator-display-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .creator-username {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .creator-bio {
            font-size: 13px;
            color: #cbd5e1;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }
        .stat-number {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 130px 20px;
        }
        .empty-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .empty-sub {
            font-size: 14px;
            color: #94a3b8;
        }
        .creations-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            padding-top: 24px;
        }
        .creation-card {
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9 / 16;
        }
        .creation-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="top-nav">
            <a href="feed.html" class="back-arrow" title="Back to Feed">&#8592;</a>
        </div>

        <div class="profile-header">
            <div id="pageColorAvatar" class="creator-color-avatar">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8.5" r="3.5" fill="rgba(255,255,255,0.85)"/>
                    <path d="M5.5 19.5C7 16.5 9.2 15 12 15C14.8 15 17 16.5 18.5 19.5" fill="rgba(255,255,255,0.85)"/>
                </svg>
            </div>
            <div>
                <div id="pageDisplayName" class="creator-display-name">Loading...</div>
                <div id="pageUsername" class="creator-username">@user</div>
                <div id="pageBio" class="creator-bio"></div>
            </div>
        </div>

        <div class="stats-bar">
            <div>
                <div id="creationCount" class="stat-number">0</div>
                <div class="stat-label">Creation</div>
            </div>
            <div>
                <div id="followersCount" class="stat-number">0</div>
                <div class="stat-label">Followers</div>
            </div>
            <div>
                <div id="followingCount" class="stat-number">0</div>
                <div class="stat-label">Following</div>
            </div>
        </div>

        <!-- Shown when user has 0 posts -->
        <div id="emptyState" class="empty-state">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="16" rx="3" stroke="#94a3b8" stroke-width="1.8"/>
                <circle cx="8.5" cy="9" r="1.5" fill="#94a3b8"/>
                <path d="M4 17L9 12L13 16L16 13L20 17" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="empty-title">No creations yet</div>
            <div class="empty-sub">When you create something, it will show up here.</div>
        </div>

        <!-- Automatically displays user's uploaded videos once they post -->
        <div id="creationsGrid" class="creations-grid"></div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="script.js"></script>
    <script>
        async function loadCreatorPage() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = "feed.html";
                return;
            }

            // 1. Load Profile Info & Colour
            const { data: profile } = await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .single();

            const name = profile?.display_name || user.user_metadata.full_name || "Creator";
            document.getElementById("pageDisplayName").textContent = name;
            document.getElementById("pageUsername").textContent = "@" + (profile?.username || "user");
            document.getElementById("pageBio").textContent = profile?.bio || "";
            document.getElementById("pageColorAvatar").style.backgroundColor = profile?.profile_color || "#007AFF";

            // 2. Count Real Creations (Videos posted by this user)
            const { data: userVideos } = await supabaseClient
                .from("videos")
                .select("id, video_url, caption")
                .eq("user_id", user.id)
                .order("created_at", { ascending: false });

            const videosList = userVideos || [];
            document.getElementById("creationCount").textContent = videosList.length;

            // 3. Count Real Followers
            const { count: followerTotal } = await supabaseClient
                .from("follows")
                .select("*", { count: "exact", head: true })
                .eq("following_id", user.id);

            document.getElementById("followersCount").textContent = followerTotal || 0;

            // 4. Count Real Following
            const { count: followingTotal } = await supabaseClient
                .from("follows")
                .select("*", { count: "exact", head: true })
                .eq("follower_id", user.id);

            document.getElementById("followingCount").textContent = followingTotal || 0;

            // Show videos in grid & hide empty state once user posts
            if (videosList.length > 0) {
                document.getElementById("emptyState").style.display = "none";
                const grid = document.getElementById("creationsGrid");
                grid.style.display = "grid";
                grid.innerHTML = videosList.map(v => `
                    <div class="creation-card">
                        <video src="${v.video_url}" muted playsinline></video>
                    </div>
                `).join("");
            }
        }

        loadCreatorPage();
    </script>
</body>
</html>
